name: sms_ume_flutter
description: SMS UME — Student Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ HTTP Client
  http: ^1.2.0
  
  # ✅ State Management
  provider: ^6.1.2
  
  # ✅ Storage
  shared_preferences: ^2.3.2
  
  # ✅ Image Caching
  cached_network_image: ^3.4.1
  
  # ✅ Image Picker
  image_picker: ^1.1.2
  
  # ✅ Routing
  go_router: ^14.2.7
  
  # ✅ Intl (Format Date)
  intl: ^0.19.0
  
  # ✅ Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/